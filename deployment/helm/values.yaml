# Default values for the inbound clearing house service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


namespace: NotConfigured
domain: NotConfigured
subDomain: ""
replicaCount: 1


constConfig:
  aspEnv: "Development"
  appInsightsKey: NotConfigured
  appInsightsConnection: NotConfigured
  #kvAppName: NotConfigured
  #kvAppVersion: NotConfigured
  kvName: NotConfigured
  azClientId: NotConfigured
  virtualDirectory: NotConfigured

image:
  repository: NotConfigured
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: v1
fullnameOverride: NotConfigured
containerPort: 7400

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: NotConfigured

scaledObject:
  start: 10 * * * *
  end: 15 * * * *

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 443
  targetPort: 7400
  nodePort: 30721

clusterissuer:
  acmeEmail: daniel.mohr@rethinkfirst.com 

agfc:
  gateway:
    namespace: ingress-system
    name: shared-gateway
  listeners:
    http: http
    https: https
  route:
    host: ""
    pathPrefix: ""
    stripPathPrefix: true
    redirectHttpToHttps: true
  healthCheck:
    host: localhost
    path: /healthcheck/live
    port: null
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    statusCodes:
      - start: 200
        end: 399
      - start: 401
        end: 401
    useTls: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Optional release pipeline overrides for container resources.
cpuRequest: null
memoryRequest: null
cpuLimit: null
memoryLimit: null
# Optional release pipeline overrides for HPA replica counts.
minReplicas: null
maxReplicas: null
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

nodeAffinity:
  enabled: false
  # AKS user pool names are generated as <first3>usr from the cluster name.
  agentPoolName: ""

dnsNames:
  - rethinkbhtech.com

datadog:
  enabled: false
  service: ""
  env: ""
  logs:
    source: ""
    service: ""
    env: ""

# Environment-specific application settings, injected as environment variables through the
# <fullname>-inbound-config ConfigMap (envFrom). Keys use '__' for nested sections, for example
# ConnectionStrings__BlobStorage__ConnectionString. Values are literals or Key Vault secret NAMES, never secrets.
# See docs/configuration.md for every key. Set per environment in values-<env>.yaml.
inboundConfig: {}

# Queue pipeline (docs/pipeline.md). Nothing below renders until enabled is true, and the service ignores the pipeline
# while mode is Off, so the legacy download endpoint is unchanged until an environment opts in.
pipeline:
  enabled: false
  # Off | Shadow | Active. Shadow lands files only; Active also registers with Billing and deletes remote files.
  mode: "Off"
  clearingHouseIds: [1, 8]
  # Service Bus namespace host, for example sb-billing-inbound-qa.servicebus.windows.net (workload identity, no keys).
  serviceBusNamespace: ""
  downloadQueueName: inbound-download
  processQueueName: inbound-process
  # Key Vault secret NAME holding the manifest connection string (Authentication=Active Directory Workload Identity).
  manifestConnectionSecretName: ""
  # Optional Kubernetes Secret with key "operatorKey" for the /inbound-pipeline operator endpoints. Unset hides them.
  operatorKeySecretName: ""
  # Extra Pipeline__*/ServiceBus__* settings, for example Pipeline__MaxAttempts: "5".
  settings: {}
  lister:
    schedule: "5 * * * *"
    timeZone: America/New_York
    activeDeadlineSeconds: 1800
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  workers:
    # Client id of the managed identity KEDA uses to read queue length.
    kedaIdentityId: ""
    pollingInterval: 30
    cooldownPeriod: 300
    download:
      minReplicas: 0
      maxReplicas: 4
      messagesPerReplica: 8
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 384Mi
    process:
      minReplicas: 0
      maxReplicas: 4
      messagesPerReplica: 8
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 384Mi
